name: Railway Nightly Schedule

on:
  schedule:
    # Miércoles 7:00 AM COT (12:00 UTC) - Encender Servicio
    - cron: '3 12 * * 3'
    # Miércoles 5:00 PM COT (22:00 UTC) - Apagar Servicio
    - cron: '3 22 * * 3'
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        required: true
        default: 'down'
        type: choice
        options:
          - down
          - redeploy

jobs:
  manage-service:
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: "decec1f6-4ccb-4158-938f-a90a8053646f"
      SERVICE_ID: "ef6b5897-c616-48ee-be1f-f0d77d9c3e12"
      ENV_ID: "59722f34-6a1f-4904-a008-cd7465552df5"
      ACTION: ${{ github.event.schedule == '3 22 * * 3' && 'down' || (github.event.schedule == '3 12 * * 3' && 'redeploy' || github.event.inputs.action) }}
    steps:
      - name: Ejecutar acción en Railway (${{ env.ACTION }})
        run: |
          set -euo pipefail
          API="https://backboard.railway.com/graphql/v2"

          api() {
            curl -sS \
              -H "Project-Access-Token: $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$1" "$API"
          }

          has_errors() { echo "$1" | jq -e '.errors != null' >/dev/null; }

          check() {
            if has_errors "$1"; then
              echo "Error de la API: $1"
              exit 1
            fi
          }

          echo "Acción: $ACTION"

          if [ "$ACTION" = "down" ]; then
            # 1) Listar los últimos despliegues del servicio
            RESP=$(api "$(jq -n \
              --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
              '{query: "query($input: DeploymentListInput!) { deployments(first: 5, input: $input) { edges { node { id status } } } }",
                variables: {input: {projectId: $p, environmentId: $e, serviceId: $s}}}')")
            check "$RESP"

            LIST=$(echo "$RESP" | jq -r '.data.deployments.edges[].node | "\(.id) \(.status)"')
            echo "Últimos despliegues:"
            echo "$LIST"

            if [ -z "$LIST" ]; then
              echo "No se encontró ningún despliegue"
              exit 1
            fi

            ATTEMPTED=0
            FAILED=0

            # 2) Eliminar (equivale a `railway down`) los despliegues activos o en progreso
            while read -r ID ST; do
              [ -z "$ID" ] && continue
              case "$ST" in
                SUCCESS|INITIALIZING|BUILDING|DEPLOYING|QUEUED|WAITING)
                  ;;
                *)
                  echo "Omitido $ID (estado: $ST)"
                  continue ;;
              esac

              ATTEMPTED=$((ATTEMPTED + 1))
              R=$(api "$(jq -n --arg id "$ID" \
                '{query: "mutation($id: String!) { deploymentRemove(id: $id) }", variables: {id: $id}}')")
              if has_errors "$R"; then
                echo "Falló deploymentRemove en $ID ($ST): $R"
                FAILED=$((FAILED + 1))
              else
                echo "deploymentRemove OK en $ID ($ST)"
              fi
            done <<< "$LIST"

            if [ "$ATTEMPTED" -eq 0 ]; then
              echo "No hay despliegues activos: el servicio ya está apagado"
            elif [ "$FAILED" -eq "$ATTEMPTED" ]; then
              echo "No se pudo apagar ningún despliegue"
              exit 1
            fi
            echo "Servicio apagado"

          else
            RESP=$(api "$(jq -n --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
              '{query: "mutation($e: String!, $s: String!) { serviceInstanceRedeploy(environmentId: $e, serviceId: $s) }",
                variables: {e: $e, s: $s}}')")
            check "$RESP"
            echo "Servicio encendido: $RESP"
          fi
