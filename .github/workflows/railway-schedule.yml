name: Railway Diagnostico

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Probar token como Project Token
        run: |
          API="https://backboard.railway.com/graphql/v2"
          echo "Longitud del token: ${#RAILWAY_API_TOKEN}"
          echo "--- Project-Access-Token:"
          curl -sS -H "Project-Access-Token: $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ projectToken { projectId environmentId } }"}' "$API"
          echo
