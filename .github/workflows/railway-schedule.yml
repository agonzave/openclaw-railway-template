name: Railway Nightly Schedule

on:
  schedule:
    # 8:00 PM COT (01:00 AM UTC) - Apagar Servicio
    - cron: '0 1 * * *'
    # 8:00 AM COT (01:00 PM UTC) - Encender Servicio
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite probar la ejecucion manualmente desde GitHub Actions

jobs:
  manage-service:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar Servicio (8:00 PM COT)
        if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          RESPONSE=$(curl -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "mutation { serviceInstanceDelete(serviceId: \"ef6b5897-c616-48ee-be1f-f0d77d9c3e12\", environmentId: \"59722f34-6a1f-4904-a008-cd7465552df5\") }"}')
          echo "Respuesta de Railway: $RESPONSE"

      - name: Encender Servicio (8:00 AM COT)
        if: github.event.schedule == '0 13 * * *'
        run: |
          RESPONSE=$(curl -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "mutation { serviceInstanceRedeploy(serviceId: \"ef6b5897-c616-48ee-be1f-f0d77d9c3e12\", environmentId: \"59722f34-6a1f-4904-a008-cd7465552df5\") }"}')
          echo "Respuesta de Railway: $RESPONSE"
