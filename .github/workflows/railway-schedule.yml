name: Railway Nightly Schedule

on:
  schedule:
    # 8:00 PM COT (01:00 AM UTC) - Apagar Servicio
    - cron: '7 1 * * *'
    # 8:00 AM COT (01:00 PM UTC) - Encender Servicio
    - cron: '13 13 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        required: true
        default: 'down'
        type: choice
        options:
          - down
          - redeploy

jobs:
  manage-service:
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: "decec1f6-4ccb-4158-938f-a90a8053646f"
      SERVICE_ID: "ef6b5897-c616-48ee-be1f-f0d77d9c3e12"
      ENV_ID: "59722f34-6a1f-4904-a008-cd7465552df5"
      ACTION: ${{ github.event.schedule == '7 1 * * *' && 'down' || (github.event.schedule == '13 13 * * *' && 'redeploy' || github.event.inputs.action) }}
    steps:
      - name: Ejecutar acción en Railway (${{ env.ACTION }})
        run: |
          set -euo pipefail
          API="https://backboard.railway.com/graphql/v2"

          api() {
            curl -sS \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$1" "$API"
          }

          check() {
            if echo "$1" | jq -e '.errors != null' >/dev/null; then
              echo "Error de la API: $1"
              exit 1
            fi
          }

          echo "Acción: $ACTION"

          if [ "$ACTION" = "down" ]; then
            # 1) Buscar el último despliegue del servicio
            RESP=$(api "$(jq -n \
              --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
              '{query: "query($input: DeploymentListInput!) { deployments(first: 1, input: $input) { edges { node { id status } } } }",
                variables: {input: {projectId: $p, environmentId: $e, serviceId: $s}}}')")
            check "$RESP"
            DEP_ID=$(echo "$RESP" | jq -r '.data.deployments.edges[0].node.id // empty')
            STATUS=$(echo "$RESP" | jq -r '.data.deployments.edges[0].node.status // empty')
            echo "Último despliegue: $DEP_ID (estado: $STATUS)"
            if [ -z "$DEP_ID" ]; then
              echo "No se encontró ningún despliegue"
              exit 1
            fi

            # 2) Detenerlo
            RESP=$(api "$(jq -n --arg id "$DEP_ID" \
              '{query: "mutation($id: String!) { deploymentStop(id: $id) }", variables: {id: $id}}')")
            check "$RESP"
            echo "Servicio apagado: $RESP"

          else
            RESP=$(api "$(jq -n --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
              '{query: "mutation($e: String!, $s: String!) { serviceInstanceRedeploy(environmentId: $e, serviceId: $s) }",
                variables: {e: $e, s: $s}}')")
            check "$RESP"
            echo "Servicio encendido: $RESP"
          fi
